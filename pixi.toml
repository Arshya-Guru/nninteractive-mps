# nnInteractive server — Apple Silicon (MPS) build.
#
# One command does everything:  pixi run start
# It solves + installs the pinned stack (first run only) and launches the official
# nnInteractive v2 server on the Apple GPU. No separate setup step.

[workspace]
name = "nninteractive-mps"
version = "0.2.0"
description = "nnInteractive interactive-segmentation server on Apple Silicon (MPS)"
channels = ["conda-forge"]
platforms = ["osx-arm64"]

[dependencies]
python = ">=3.12,<3.13"

[pypi-dependencies]
# The official nnInteractive v2 package ships the inference server (`nninteractive-server`)
# that the current SlicerNNInteractive extension talks to (Remote mode). The extension only
# accepts a v2 backend (>=2.5.1, <3), so stay on the same major version. It pulls in
# nnU-Net, PyTorch (the arm64 macOS wheel includes the MPS backend) and everything else.
nninteractive = ">=2.6.0,<3"

[activation.env]
# Lets PyTorch run any op that lacks an MPS kernel on the CPU instead of crashing.
PYTORCH_ENABLE_MPS_FALLBACK = "1"

[tasks]
# Start the server on http://localhost:1527. Extra arguments are passed through to
# `nninteractive-server`, e.g. `pixi run start --port 1530`.
# The first launch downloads the model weights (~400 MB) into ~/.nninteractive;
# subsequent launches are fast.
start = "python server/server_mps.py"

# Optional: confirm the Apple GPU (MPS) backend is available.
verify = """
python -c "import torch; b = getattr(torch.backends, 'mps', None) is not None and torch.backends.mps.is_built(); a = b and torch.backends.mps.is_available(); print('torch:', torch.__version__); print('MPS built:', b, '| MPS available:', a); print('OK: server will run on the Apple GPU (mps).' if a else 'NOTE: MPS not available - server falls back to CPU (slower).')"
"""
